<main class="u-bg-dark relative">
  <!-- Waits for the content (or, when the API is down, the default content) so the old texts never flash by. -->
  @if (content(); as c) {
    @for (part of parts; track part.key) {
      <mvo-home-part [part]="part.key" [content]="c" [projectImages]="projectImages()"/>
    }
  } @else {
    <div class="min-h-[85dvh]" aria-hidden="true"></div>
  }
</main>
