<div class="
  flex flex-col items-center text-center gap-6 px-4 py-6
  rounded-lg shadow u-bg-surface h-full
  lg:flex-row lg:items-start lg:text-left lg:px-0
  lg:rounded-none lg:shadow-none lg:gap-4"
>
  <div class="flex items-center justify-center shrink-0
              w-12 h-12 rounded-full border-2 u-border-accent">
    <fa-icon [icon]="highlight()!.icon" class="u-text-brand" size="lg"></fa-icon>
  </div>

  <div class="flex flex-col gap-1 max-w-46">
    <h5 class="u-text-body">{{ highlight()?.titleKey | translate }}</h5>
    <p class="text-sm u-text-secondary">{{ highlight()?.descriptionKey | translate }}</p>
  </div>
</div>
