<div class="
  flex flex-col items-center text-center gap-4 px-3 py-5
  rounded-lg u-bg-dark-elevated h-full
  lg:flex-row lg:items-start lg:text-left lg:px-0 lg:bg-transparent!
  lg:rounded-none lg:gap-4"
>
  <div class="flex items-center justify-center shrink-0
              w-12 h-12 rounded-full border u-border-accent">
    <fa-icon [icon]="highlight()!.icon" class="u-text-brand" size="lg"></fa-icon>
  </div>

  <div class="flex flex-col gap-1 max-w-46">
    <h5 class="u-text-dark-heading">{{ highlight()?.titleKey | translate }}</h5>
    <p class="text-sm u-text-dark-body">{{ highlight()?.descriptionKey | translate }}</p>
  </div>
</div>
